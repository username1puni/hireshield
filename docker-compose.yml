services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hireshield
      POSTGRES_USER: ${DB_USERNAME:-hireshield}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hireshield}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-hireshield}"]
      interval: 5s
      retries: 10
    ports:
      - "5432:5432"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/hireshield
    ports:
      - "8080:8080"

volumes:
  pgdata:
